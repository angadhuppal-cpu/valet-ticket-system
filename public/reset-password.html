<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <title>Set New Password · Valet Ticket System</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🅿️</text></svg>" />
  <style>
    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-card { width: 100%; max-width: 400px; }
    .auth-head { text-align: center; margin-bottom: 18px; }
    .auth-head .logo { font-size: 44px; }
    .auth-head h1 { font-size: 20px; margin: 8px 0 2px; }
    .auth-head p { color: var(--muted); font-size: 13px; margin: 0; }
    .switch { text-align: center; font-size: 13px; color: var(--muted); margin-top: 14px; }
    .switch a { color: var(--accent); cursor: pointer; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="card auth-card">
      <div class="auth-head">
        <div class="logo">🅿️</div>
        <h1>Set New Password</h1>
        <p id="subtitle">Enter your new password below</p>
      </div>

      <label class="field" id="usernameDisplay" style="display:none"><span>Username</span>
        <input id="username" type="text" disabled style="background: var(--bg-secondary);" />
      </label>

      <label class="field"><span>New Password</span>
        <input id="password" type="password" autocomplete="new-password" autofocus />
      </label>

      <label class="field"><span>Confirm Password</span>
        <input id="confirmPassword" type="password" autocomplete="new-password" />
      </label>

      <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; margin-bottom: 16px;">
        <input type="checkbox" id="showPassword" style="cursor: pointer;" />
        <span>Show password</span>
      </label>

      <button id="submitBtn" class="primary-btn big">Reset Password</button>
      <div id="authMsg" class="inline-msg"></div>

      <div class="switch">
        <a href="/login.html">Back to Sign in</a>
      </div>
    </div>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    const token = new URLSearchParams(location.search).get('token');

    async function verifyToken() {
      if (!token) {
        $('#subtitle').textContent = 'Invalid or missing reset token';
        $('#submitBtn').disabled = true;
        return;
      }

      try {
        const res = await fetch('/api/auth/reset-verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token }),
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Invalid token');

        $('#subtitle').textContent = `Reset password for ${data.username}`;
        $('#username').value = data.username;
        $('#usernameDisplay').style.display = '';
      } catch (err) {
        $('#authMsg').className = 'inline-msg err';
        $('#authMsg').textContent = err.message;
        $('#submitBtn').disabled = true;
      }
    }

    // Show/hide password toggle
    $('#showPassword').addEventListener('change', (e) => {
      const type = e.target.checked ? 'text' : 'password';
      $('#password').type = type;
      $('#confirmPassword').type = type;
    });

    async function submit() {
      const btn = $('#submitBtn');
      const msg = $('#authMsg');
      msg.className = 'inline-msg';
      msg.textContent = '';

      const password = $('#password').value;
      const confirmPassword = $('#confirmPassword').value;

      if (!password || password.length < 6) {
        msg.className = 'inline-msg err';
        msg.textContent = 'Password must be at least 6 characters.';
        return;
      }

      if (password !== confirmPassword) {
        msg.className = 'inline-msg err';
        msg.textContent = 'Passwords do not match.';
        return;
      }

      btn.disabled = true;
      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Something went wrong');

        msg.className = 'inline-msg success';
        msg.textContent = 'Password reset successfully! Redirecting to login...';

        setTimeout(() => {
          location.href = '/login.html';
        }, 2000);
      } catch (err) {
        msg.className = 'inline-msg err';
        msg.textContent = err.message;
        btn.disabled = false;
      }
    }

    $('#submitBtn').addEventListener('click', submit);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submit();
    });

    verifyToken();
  </script>
</body>
</html>
