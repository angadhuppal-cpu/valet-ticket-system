<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Print Valet Ticket</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🅿️</text></svg>" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef1f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #0b1220; }
    .toolbar { display: flex; gap: 10px; justify-content: center; padding: 16px; }
    .toolbar button { font-size: 14px; font-weight: 700; padding: 10px 18px; border-radius: 10px; border: 1px solid #c7cede; background: #fff; cursor: pointer; }
    .toolbar button.primary { background: #4f8cff; color: #fff; border-color: #4f8cff; }

    .stub {
      width: 340px; margin: 0 auto; background: #fff; border: 2px solid #0b1220; border-radius: 14px;
      padding: 22px; text-align: center;
    }
    .stub .event { font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: #4a5878; }
    .stub .brand { font-size: 18px; font-weight: 800; margin-top: 2px; }
    .divider { border: none; border-top: 2px dashed #c7cede; margin: 14px 0; }
    .stub .tlabel { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #4a5878; }
    .stub .tnum { font-size: 76px; font-weight: 900; line-height: 1; margin: 2px 0 8px; }
    .stub .car { font-size: 18px; font-weight: 700; }
    .stub .plate { display: inline-block; font-family: ui-monospace, Menlo, monospace; letter-spacing: 2px; border: 1px solid #0b1220; border-radius: 6px; padding: 3px 10px; margin-top: 8px; }
    .stub .phone { font-size: 14px; color: #4a5878; margin-top: 8px; }
    .car-photo { width: 100%; max-width: 280px; height: auto; margin: 12px auto; border-radius: 8px; border: 1px solid #c7cede; }

    @media print {
      .toolbar { display: none; }
      body { background: #fff; }
      .stub { border-width: 1px; }
      @page { margin: 12mm; }
    }
    #err { text-align: center; padding: 40px; color: #b23; }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="primary" onclick="window.print()">🖨️ Print ticket</button>
    <button onclick="shareTicket()">📤 Share</button>
    <button onclick="window.close()">Close</button>
  </div>

  <div id="stub" class="stub" style="display:none">
    <div class="event" id="event"></div>
    <div class="brand">🅿️ Valet Parking</div>
    <hr class="divider" />
    <div class="tlabel">Ticket</div>
    <div class="tnum" id="num">–</div>
    <div class="car" id="car"></div>
    <div id="plateWrap"><span class="plate" id="plate"></span></div>
    <div class="phone" id="phone"></div>
    <hr class="divider" />
    <img id="carPhoto" class="car-photo" style="display:none" />
  </div>
  <div id="err" style="display:none">Ticket not found.</div>

  <script>
    const token = new URLSearchParams(location.search).get('t');
    let shareUrl = '';
    let ticketNumber = '';

    async function load() {
      if (!token) return fail();
      try {
        const res = await fetch('/api/t/' + encodeURIComponent(token));
        if (!res.ok) return fail();
        const t = await res.json();
        shareUrl = t.share_url;
        ticketNumber = t.ticket_number;
        document.getElementById('event').textContent = t.event_name;
        document.getElementById('num').textContent = t.ticket_number;
        const car = [t.color, t.make_model].filter(Boolean).join(' ');
        document.getElementById('car').textContent = car || 'Vehicle';
        if (t.plate) document.getElementById('plate').textContent = t.plate;
        else document.getElementById('plateWrap').style.display = 'none';
        if (t.phone) document.getElementById('phone').textContent = '📱 ' + t.phone;
        if (t.front_photo) {
          const img = document.getElementById('carPhoto');
          img.src = t.front_photo;
          img.style.display = 'block';
        }
        document.getElementById('stub').style.display = '';
      } catch { fail(); }
    }

    async function shareTicket() {
      if (!shareUrl) return alert('Ticket link not available');

      // Try using Web Share API if available (mobile devices)
      if (navigator.share) {
        try {
          await navigator.share({
            title: `Valet Ticket #${ticketNumber}`,
            text: `Your valet parking ticket #${ticketNumber}`,
            url: shareUrl
          });
        } catch (err) {
          // User cancelled share or error occurred
          if (err.name !== 'AbortError') {
            copyToClipboard();
          }
        }
      } else {
        // Fallback: copy to clipboard
        copyToClipboard();
      }
    }

    function copyToClipboard() {
      navigator.clipboard.writeText(shareUrl).then(() => {
        alert('Ticket link copied to clipboard!');
      }).catch(() => {
        // Fallback for older browsers
        const textarea = document.createElement('textarea');
        textarea.value = shareUrl;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        alert('Ticket link copied to clipboard!');
      });
    }

    function fail() { document.getElementById('err').style.display = ''; }
    load();
  </script>
</body>
</html>
